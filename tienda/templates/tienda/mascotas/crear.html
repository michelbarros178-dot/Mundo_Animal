{% extends 'tienda/base.html' %}
{% block contenido %}
<div class="card">
    <div class="card-header bg-primary text-white"><h3>Registrar Mascota</h3></div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'lista_mascotas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
