databases:
  - name: mundo-animal-db
    databaseName: mundo_animal_db
    user: mundo_user
    plan: free
    region: oregon

services:
  - type: web
    name: Mundo_Animal 
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python create_superuser.py && gunicorn --bind 0.0.0.0:10000 --workers 3 mundo_animal_web.wsgi:application"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mundo-animal-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "michel"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "michel@correo.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Mundo2026!"